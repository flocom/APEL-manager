name: apel-manager

x-app-build: &app-build
  context: .

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-apel_manager}
  POSTGRES_USER: ${POSTGRES_USER:-apel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apel-local-only}
  AUTH_SECRET: ${AUTH_SECRET:-}
  OAUTH_SECRET: ${OAUTH_SECRET:-}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  CRON_SECRET: ${CRON_SECRET:-}
  OAUTH_ISSUER: ${OAUTH_ISSUER:-}
  MCP_BASE_URL: ${MCP_BASE_URL:-}
  MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/data/uploads}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-15728640}
  UPLOAD_ORPHAN_MAX_AGE_HOURS: ${UPLOAD_ORPHAN_MAX_AGE_HOURS:-24}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apel_manager}
      POSTGRES_USER: ${POSTGRES_USER:-apel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apel-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.30.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    volumes:
      - mailpit_data:/data
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APEL_IMAGE:-apel-manager:local}
    build: *app-build
    restart: unless-stopped
    init: true
    environment: *app-environment
    volumes:
      - app_config:/app/data/config
      - uploads_data:/app/data/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  scheduler:
    image: ${APEL_IMAGE:-apel-manager:local}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "1"
      CRON_TARGET_URL: http://app:3000/api/cron/notifications
      SCHEDULER_HOUR_UTC: ${SCHEDULER_HOUR_UTC:-7}
      SCHEDULER_MINUTE_UTC: ${SCHEDULER_MINUTE_UTC:-0}
      RUN_CRON_ON_START: ${RUN_CRON_ON_START:-false}
    command: ["node", "scripts/scheduler.mjs"]
    volumes:
      - app_config:/app/data/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
      CADDY_MAX_UPLOAD_SIZE: ${CADDY_MAX_UPLOAD_SIZE:-20MB}
    ports:
      - "${HTTP_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
      - "${HTTPS_PORT:-3443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  app_config:
  uploads_data:
  mailpit_data:
  caddy_data:
  caddy_config:
