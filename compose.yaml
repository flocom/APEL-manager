name: apel-manager

x-app-build: &app-build
  context: .

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-apel_manager}
  POSTGRES_USER: ${POSTGRES_USER:-apel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apel-local-only}
  AUTH_SECRET: ${AUTH_SECRET:-}
  OAUTH_SECRET: ${OAUTH_SECRET:-}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  CRON_SECRET: ${CRON_SECRET:-}
  OAUTH_ISSUER: ${OAUTH_ISSUER:-}
  MCP_BASE_URL: ${MCP_BASE_URL:-}
  MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/data/uploads}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-15728640}
  UPLOAD_ORPHAN_MAX_AGE_HOURS: ${UPLOAD_ORPHAN_MAX_AGE_HOURS:-24}
  # Permet à l'écran Configuration d'indiquer si la mise à jour automatique
  # tourne et à quelle cadence, sans dupliquer le réglage.
  COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
  WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-3600}
  WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
  UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-flocom/APEL-manager}
  UPDATE_CHANNEL: ${UPDATE_CHANNEL:-main}
  UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apel_manager}
      POSTGRES_USER: ${POSTGRES_USER:-apel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apel-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.30.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    volumes:
      - mailpit_data:/data
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APEL_IMAGE:-ghcr.io/flocom/apel-manager:latest}
    build: *app-build
    restart: unless-stopped
    init: true
    environment: *app-environment
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - app_config:/app/data/config
      - uploads_data:/app/data/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  scheduler:
    image: ${APEL_IMAGE:-ghcr.io/flocom/apel-manager:latest}
    restart: unless-stopped
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "1"
      CRON_TARGET_URL: http://app:3000/api/cron/notifications
      SCHEDULER_HOUR_UTC: ${SCHEDULER_HOUR_UTC:-7}
      SCHEDULER_MINUTE_UTC: ${SCHEDULER_MINUTE_UTC:-0}
      RUN_CRON_ON_START: ${RUN_CRON_ON_START:-false}
    command: ["node", "scripts/scheduler.mjs"]
    volumes:
      - app_config:/app/data/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # Mise à jour automatique. Surveille l'image publiée sur GHCR et recrée `app`
  # et `scheduler` dès qu'une nouvelle version paraît ; l'entrypoint applique
  # ensuite les migrations. Seuls les conteneurs portant le label
  # `com.centurylinklabs.watchtower.enable` sont concernés : la base, le proxy
  # et Mailpit ne sont jamais touchés.
  #
  # Service inactif par défaut. Pour l'activer, renseigner dans `.env` :
  #     COMPOSE_PROFILES="autoupdate"
  # À laisser vide en développement local, sinon l'image construite depuis les
  # sources serait remplacée par celle du registre.
  updater:
    image: containrrr/watchtower:1.7.1
    profiles: ["autoupdate"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-3600}
      # Déclenchement à la demande depuis Configuration. Sans jeton, l'API
      # reste fermée et le bouton n'apparaît pas dans l'application.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      TZ: ${TZ:-Europe/Paris}
    # Joignable uniquement depuis le réseau Compose : jamais publié sur l'hôte.
    expose:
      - "8080"
    volumes:
      # Accès nécessaire pour recréer les conteneurs. À n'activer que sur une
      # machine dont les accès sont maîtrisés.
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
      CADDY_MAX_UPLOAD_SIZE: ${CADDY_MAX_UPLOAD_SIZE:-20MB}
    ports:
      - "${HTTP_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
      - "${HTTPS_PORT:-3443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  app_config:
  uploads_data:
  mailpit_data:
  caddy_data:
  caddy_config:
